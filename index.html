<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075c45"><title>Zimmah Pro</title><style>
:root{--g:#075c45;--g2:#087b5b;--bg:#f4f7f6;--w:#fff;--t:#17231f;--m:#71807a;--l:#dfe8e4;--r:17px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:12px}.toprow,.between,.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.brand{flex:1;font-weight:900;font-size:20px}.brand small{display:block;font-size:10px;opacity:.7}.ico{width:40px;height:40px;border:0;border-radius:12px;background:#ffffff18;color:#fff;font-size:19px}.view{padding:15px}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:23px;padding:20px;margin-bottom:13px}.hero h1{margin:0 0 5px}.hero p{margin:0;opacity:.82;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.item{background:var(--w);border:1px solid var(--l);border-radius:var(--r);padding:14px;box-shadow:0 7px 24px #075c450d}.stat .label{font-size:11px;color:var(--m)}.num{font-size:21px;font-weight:900;margin-top:5px}.green{color:var(--g2)}.red{color:#c53d4b}.blue{color:#2767b1}.section{font-weight:900;font-size:17px;margin:18px 0 9px}.list{display:grid;gap:9px}.avatar{width:41px;height:41px;border-radius:12px;background:#e7f2ee;color:var(--g);display:grid;place-items:center;font-weight:900}.item h3{margin:0;font-size:14px}.item p{margin:3px 0 0;color:var(--m);font-size:11px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:20}.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#73807c;padding:7px;font-size:11px}.nav b{display:block;font-size:20px}.nav .on{color:var(--g);font-weight:900}.fab{position:fixed;right:18px;bottom:91px;width:54px;height:54px;border:0;border-radius:18px;background:var(--g);color:#fff;font-size:28px;z-index:15;box-shadow:0 9px 22px #0003}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--g);color:#fff}.secondary{background:#e9f2ee;color:var(--g)}.danger{background:#fff0f1;color:#c53d4b}input,select{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:#fff;font:inherit}label{display:block;color:var(--m);font-size:12px;font-weight:700;margin:10px 0 5px}.modal,.setup,.login{position:fixed;inset:0;z-index:50;background:#0007;display:none}.modal{align-items:end;justify-content:center}.sheet{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:23px 23px 0 0;padding:19px}.setup,.login{background:var(--bg);overflow:auto}.setupbox,.loginbox{max-width:600px;margin:auto;padding:25px 17px}.setupbox{text-align:center}.login{background:linear-gradient(140deg,#043b2d,var(--g));color:#fff;align-items:center;justify-content:center}.loginbox{text-align:center;width:min(390px,100%)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.keypad button{height:56px;border:0;border-radius:14px;background:#ffffff18;color:#fff;font-size:20px}.pin{text-align:center;font-size:26px;letter-spacing:9px}.demo{background:#fff3cd;color:#705208;border-radius:13px;padding:10px;margin:11px 0;font-size:12px}.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#17231f;color:#fff;padding:10px 15px;border-radius:12px;z-index:100;display:none;font-size:12px}.blur .money{filter:blur(7px)}.log{border-right:3px solid #dbeae4;padding:5px 11px 12px;margin:5px}.log strong{display:block}.log small{color:var(--m)}footer{text-align:center;color:#9aa7a2;font-size:10px;padding:20px}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div style="font-size:55px">🔐</div><h1>Zimmah Pro</h1><p>أدخل PIN لفتح التطبيق</p><input id="pin" class="pin" readonly maxlength="6"><div id="keys" class="keypad"></div></div></div>
<div id="setup" class="setup"><div class="setupbox"><div style="font-size:58px">📒</div><h1>Zimmah Pro</h1><p>دفتر ذمم رقمي بسيط للتاجر، يعمل محلياً وبدون اشتراك.</p><div class="card"><h2>جرّب التطبيق الآن</h2><p style="color:var(--m);font-size:13px">سيتم إنشاء بيانات وهمية جاهزة لتتعلم التطبيق. يمكنك حذفها لاحقاً والبدء ببيانات متجرك.</p><button class="primary" style="width:100%" onclick="demo()">🧪 ابدأ بالبيانات التجريبية</button><button class="secondary" style="width:100%;margin-top:8px" onclick="real()">🏪 ابدأ بمتجري الحقيقي</button></div><div class="card" style="margin-top:11px"><h3>🔐 حماية اختيارية</h3><button class="secondary" onclick="newPin()">إنشاء PIN</button> <button class="secondary" onclick="skip()">تخطي</button></div></div></div>
<div id="app" class="app"><header class="top"><div class="toprow"><div class="brand">ذمة برو<small>Zimmah Pro • Micro-Debt Ledger</small></div><button class="ico" onclick="privacy()">👁️</button><button class="ico" onclick="auditPage()">🕒</button><button class="ico" onclick="lang()">🌐</button><button class="ico" onclick="lock()">🔒</button><button class="ico" onclick="go('settings')">⚙️</button></div></header><main id="view" class="view"></main><button id="fab" class="fab" onclick="addPerson(cur==='customers'?'customer':'supplier')">＋</button></div>
<div class="bottom"><nav class="nav"><button id="n-home" onclick="go('home')"><b>🏠</b>الرئيسية</button><button id="n-customers" onclick="go('customers')"><b>👥</b>الزبائن</button><button id="n-suppliers" onclick="go('suppliers')"><b>🏪</b>الموردون</button><button id="n-settings" onclick="go('settings')"><b>⚙️</b>الإعدادات</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><button class="secondary" onclick="closeM()">✕</button><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script>
const K='ZIMMAH_PRO_V1';let S=load(),cur='home',q='';function load(){try{return JSON.parse(localStorage.getItem(K))||base()}catch(e){return base()}}function base(){return{setup:true,demo:false,pin:'',store:'متجري',currency:'USD',privacy:false,customers:[],suppliers:[],tx:[],audit:[]}}function save(){localStorage.setItem(K,JSON.stringify(S))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function money(x){return(Number(x)||0).toFixed(2)+' '+S.currency}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function log(a,d){S.audit.unshift({time:Date.now(),a,d});S.audit=S.audit.slice(0,500);save()}function sum(ledger){return S.tx.filter(x=>x.ledger===ledger).reduce((a,x)=>a+x.amount,0)}function render(){if(S.setup){setup.style.display='block';app.style.display='none';return}setup.style.display='none';app.style.display='block';document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));let n=document.getElementById('n-'+cur);if(n)n.classList.add('on');app.classList.toggle('blur',S.privacy);fab.style.display=cur==='customers'||cur==='suppliers'?'block':'none';view.innerHTML=cur==='home'?home():cur==='customers'?people('customer'):cur==='suppliers'?people('supplier'):cur==='settings'?settings():auditView()}function home(){let c=Math.max(0,sum('customer')),s=Math.max(0,sum('supplier')),inc=S.tx.filter(x=>x.kind==='income').reduce((a,x)=>a+Math.abs(x.amount),0),out=S.tx.filter(x=>x.kind==='expense').reduce((a,x)=>a+Math.abs(x.amount),0);return `<div class="hero"><h1>مرحباً بك 👋</h1><p>سجّل الحقوق بسرعة وراجعها بوضوح حتى بدون إنترنت.</p></div>${S.demo?'<div class="demo">🧪 <b>الوضع التجريبي فعال.</b> البيانات وهمية للتعلم. <button class="danger" onclick="real()">مسح والبدء الحقيقي</button></div>':''}<div class="grid"><div class="card stat"><div class="label">لنا — ديون الزبائن</div><div class="num green money">${money(c)}</div></div><div class="card stat"><div class="label">علينا — الموردون</div><div class="num red money">${money(s)}</div></div><div class="card stat"><div class="label">الدخل المسجل</div><div class="num blue money">${money(inc)}</div></div><div class="card stat"><div class="label">المصروف</div><div class="num red money">${money(out)}</div></div></div><div class="section">آخر العمليات</div>${recent()}<footer>Zimmah Pro • مجاني • Offline-first</footer>`}function recent(){let a=S.tx.slice(-6).reverse();if(!a.length)return'<div class="card">لا توجد عمليات بعد. استخدم ＋ للبدء.</div>';return'<div class="list">'+a.map(x=>{let ar=x.ledger==='customer'?S.customers:S.suppliers,p=ar.find(z=>z.id===x.pid);return`<div class="item"><div class="between"><span>${p?p.name:x.label}</span><b class="money">${money(x.amount)}</b></div><small>${x.label} • ${new Date(x.time).toLocaleString()}</small></div>`}).join('')+'</div>'}function people(k){let ar=k==='customer'?S.customers:S.suppliers,arr=ar.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q.toLowerCase()));return`<div class="between"><div><h2 style="margin:0">${k==='customer'?'الزبائن':'الموردون'}</h2><small style="color:var(--m)">${k==='customer'?'ما لهم عندك':'ما عليك لهم'}</small></div><button class="primary" onclick="addPerson('${k}')">＋ إضافة</button></div><input style="margin:12px 0" placeholder="🔎 بحث" value="${q}" oninput="q=this.value;render()">${arr.length?'<div class="list">'+arr.map(p=>{let b=S.tx.filter(x=>x.ledger===k&&x.pid===p.id).reduce((a,x)=>a+x.amount,0);return`<div class="item" onclick="detail('${k}','${p.id}')"><div class="between"><div class="row"><div class="avatar">${p.name[0]}</div><div><h3>${p.name}</h3><p>${p.phone||'بدون هاتف'}</p></div></div><b class="money ${b>0?'red':'green'}">${money(b)}</b></div></div>`}).join('')+'</div>':'<div class="card" style="margin-top:10px;text-align:center;color:var(--m)">لا توجد بيانات. أضف أول '+(k==='customer'?'زبون':'مورد')+'</div>'}`}function addPerson(k){modal.style.display='flex';mb.innerHTML=`<h2>إضافة ${k==='customer'?'زبون':'مورد'}</h2><label>الاسم *</label><input id="pn"><label>الهاتف</label><input id="ph" inputmode="tel"><button class="primary" style="margin-top:13px;width:100%" onclick="saveP('${k}')">حفظ</button>`}function saveP(k){let n=pn.value.trim();if(!n)return toast('أدخل الاسم');let p={id:id(),name:n,phone:ph.value.trim()};(k==='customer'?S.customers:S.suppliers).push(p);log('إضافة '+(k==='customer'?'زبون':'مورد'),n);save();closeM();render()}function detail(k,pid){let ar=k==='customer'?S.customers:S.suppliers,p=ar.find(x=>x.id===pid),b=S.tx.filter(x=>x.ledger===k&&x.pid===pid).reduce((a,x)=>a+x.amount,0),tx=S.tx.filter(x=>x.ledger===k&&x.pid===pid).reverse();modal.style.display='flex';mb.innerHTML=`<h2>${p.name}</h2><p style="color:var(--m)">${p.phone||''}</p><div class="card"><small>الرصيد</small><div class="num ${b>0?'red':'green'} money">${money(b)}</div></div><div class="row" style="margin-top:10px"><button class="primary" onclick="txForm('${k}','${pid}',1)">＋ ${k==='customer'?'دين':'التزام'}</button><button class="secondary" onclick="txForm('${k}','${pid}',-1)">− دفعة</button></div><div class="section">السجل</div>${tx.length?tx.map(x=>`<div class="item" style="margin-bottom:7px"><div class="between"><span>${x.label}</span><b class="money">${money(x.amount)}</b></div><small>${new Date(x.time).toLocaleString()}</small></div>`).join(''):'<div>لا توجد عمليات.</div>'}`}function txForm(k,pid,d){modal.style.display='flex';mb.innerHTML=`<h2>${d>0?'إضافة':'تسجيل دفعة'}</h2><label>المبلغ *</label><input id="amt" type="number" min=".01" step=".01"><label>ملاحظة</label><input id="note"><button class="primary" style="margin-top:13px;width:100%" onclick="saveTx('${k}','${pid}',${d})">حفظ</button>`}function saveTx(k,pid,d){let a=Number(amt.value);if(!(a>0))return toast('أدخل مبلغاً صحيحاً');let label=d>0?(k==='customer'?'دين جديد':'التزام جديد'):'دفعة';S.tx.push({id:id(),time:Date.now(),ledger:k,pid,amount:a*d,label:note.value?label+' — '+note.value:label,kind:d>0?'debt':'income'});log(label,(k==='customer'?'زبون':'مورد'));save();closeM();render();toast('تم التسجيل')}function settings(){return`<h2>الإعدادات</h2><div class="card"><label>اسم المتجر</label><input id="sn" value="${S.store}"><label>العملة</label><select id="cu"><option>USD</option><option>SOS</option><option>KES</option></select><button class="primary" style="margin-top:10px" onclick="settingsSave()">حفظ</button></div><div class="section">🔐 الأمان والخصوصية</div><div class="card"><button class="secondary" onclick="privacy()">${S.privacy?'إظهار':'إخفاء'} المبالغ 👁️</button> <button class="secondary" onclick="lock()">🔒 قفل</button><button class="secondary" style="margin-top:8px" onclick="newPin()">تغيير/إنشاء PIN</button></div><div class="section">💾 البيانات</div><div class="card"><button class="secondary" onclick="backup()">⬇️ نسخة احتياطية</button> <button class="secondary" onclick="restore()">⬆️ استعادة</button><p style="font-size:11px;color:var(--m)">البيانات محلية على الجهاز. احتفظ بنسخة احتياطية عند تغيير الجهاز.</p></div><div class="section">🧪 Demo</div><div class="card"><button class="secondary" onclick="demo()">تحميل البيانات التجريبية</button> <button class="danger" onclick="real()">مسح وبدء حقيقي</button></div>`}function settingsSave(){S.store=sn.value.trim()||'متجري';S.currency=cu.value;save();log('تحديث الإعدادات','');render();toast('تم الحفظ')}function auditView(){return`<div class="between"><h2>🕒 سجل التدقيق</h2><button class="secondary" onclick="go('home')">رجوع</button></div><div class="card">${S.audit.length?S.audit.map(x=>`<div class="log"><strong>${x.a}</strong><span>${x.d||''}</span><small>${new Date(x.time).toLocaleString()}</small></div>`).join(''):'السجل فارغ'}</div>`}function auditPage(){go('audit')}function go(x){q='';cur=x;render()}function closeM(){modal.style.display='none'}function privacy(){S.privacy=!S.privacy;save();render()}function lang(){toast('العربية هي لغة V1. التعدد الكامل في V2')}function demo(){S=base();S.setup=false;S.demo=true;let a={id:id(),name:'أحمد علي',phone:'+252 61 0000000'},b={id:id(),name:'أمينة يوسف',phone:'+252 62 1111111'},s={id:id(),name:'Hodan Wholesale',phone:'+252 63 2222222'};S.customers=[a,b];S.suppliers=[s];S.tx=[{id:id(),time:Date.now()-864e5,ledger:'customer',pid:a.id,amount:35,label:'دين تجريبي',kind:'debt'},{id:id(),time:Date.now()-5e6,ledger:'customer',pid:a.id,amount:-10,label:'دفعة تجريبية',kind:'income'},{id:id(),time:Date.now()-2e6,ledger:'customer',pid:b.id,amount:18,label:'دين تجريبي',kind:'debt'},{id:id(),time:Date.now()-8e6,ledger:'supplier',pid:s.id,amount:80,label:'التزام تجريبي',kind:'debt'},{id:id(),time:Date.now()-7e6,ledger:'supplier',pid:s.id,amount:-20,label:'دفعة للمورد',kind:'income'},{id:id(),time:Date.now()-6e6,ledger:'cash',pid:'',amount:120,label:'دخل تجريبي',kind:'income'},{id:id(),time:Date.now()-5e6,ledger:'cash',pid:'',amount:45,label:'مصروف تجريبي',kind:'expense'}];log('Demo','بيانات وهمية للتعلم');save();render()}function real(){if(!confirm('سيتم حذف بيانات هذا الجهاز والبدء بدفتر فارغ.'))return;S=base();S.setup=false;save();render()}async function hp(x){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}async function newPin(){let n=prompt('PIN جديد: 4–6 أرقام');if(!/^\d{4,6}$/.test(n||''))return toast('PIN غير صالح');S.pin=await hp(n);save();toast('تم حفظ PIN')}function skip(){S.setup=false;save();render()}function lock(){if(!S.pin)return toast('أنشئ PIN أولاً');login.style.display='flex';pin.value='';keys.innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}function key(k){if(k==='⌫')pin.value=pin.value.slice(0,-1);else if(k==='✓')unlock();else if(pin.value.length<6)pin.value+=k}async function unlock(){if(await hp(pin.value)===S.pin){login.style.display='none';toast('تم الفتح')}else{pin.value='';toast('PIN غير صحيح')}}function backup(){let b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zimmah-pro-backup.json';a.click();toast('تم إنشاء النسخة')}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{S=JSON.parse(await i.files[0].text());S.setup=false;save();render();toast('تمت الاستعادة')}catch(e){toast('ملف غير صالح')}};i.click()}render();
</script></body></html>
